
<!-- Design by Asrith-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JavaScript Age Calculator</title>
  <style media="screen">
    body{
  font-family: Arial, Helvetica, sans-serif;
  background-color: #2782e3;
  font-size: 15px;
  line-height: 1.5;
  padding: 0;
  margin: 0;
}
* {
  box-sizing: border-box;
}
.container{
  width: min(520px, calc(100% - 24px));
  height: auto;
  margin: 100px auto;
  background-color: #eee;

  border-radius: 5px;
}
.base{
  width: 100%;

  margin: 0;
  overflow: hidden;
  display: block;
  float: none;
}
.block{
  width: calc(33.333% - 20px);
  padding: 5px 8px;

  margin-left: 20px;
  display: inline-block;
  float: left;
}
.base h4{
  font-size: 26px;
  text-align: center;
  font-family: sans-serif;
  font-weight: normal;
  margin-top: 0px;
  box-shadow: 0px 2px #bababa;
  background: white;
  font-size: 34px;
  color: navy;
}

.title{
  font-size: 20px;
  text-align: left;
  font-family: sans-serif;
  font-weight: normal;
  line-height: 0.5;
  letter-spacing: 0.5px;
  word-spacing: 2.7px;
  color: #1073d0;
}
input[type=text] {
  width: 100%;
  margin: auto;
  outline: none;
  min-height: 50px;
  border: 2px solid #1073d0;
  padding: 12px;
  background-color: #f7f7f7;
    border-radius: 2px;
    color: #1073d0;
    font-size: 17px;
}
input[type=text]:focus{
  background-color: #ffffff;
  border: 2px solid orange;
  outline: none;
}
input[type=button]{
  width: 150px;
  margin-left: 35%;
  margin-top: 40px;
  outline: none;
  border: none;
  border-radius: 2px;
  background-color: #0761b6;
  color: #ffffff;
  padding: 14px 16px;
  text-align: center;

  font-size: 16px;
}
input[type=button]:hover{
  background-color: #003669;
}

#age{
  display: block;
  margin: 10px;
  margin-top: 35px;
  padding: 10px;
  padding-bottom: 20px;
  overflow: hidden;
  font-family: verdana;
  font-size: 23px;
  font-weight: normal;
  line-height: 1.5;
  word-spacing: 2.7px;
  color: navy;
}
  </style>
</head>
<body>

<div class="container">
  <form>
    <div class="base">
      <div class="enter">
      <h4>Age Calculator</h4>
    </div>
  <div class="block">
    <p class="title">Date</p>
    <input type="text" name="date" id="date" inputmode="numeric" aria-label="Birth date" placeholder="dd" required="required" minlength="1" maxlength="2" />
  </div>
  <div class="block">
    <p class="title">Month</p>
    <input type="text" name="month" id="month" inputmode="numeric" aria-label="Birth month" placeholder="mm" required="required" minlength="1" maxlength="2" />
  </div>
  <div class="block">
    <p class="title">Year</p>
    <input type="text" name="year" id="year" inputmode="numeric" aria-label="Birth year" placeholder="yyyy" required="required" minlength="4" maxlength="4" />
  </div>
  </div>
  <div class="base">
    <div class="enter">
    <input type="button" name="submit" value="Submit" onclick="age()" />
    </div>
  </div>
    <div id="age" role="status" aria-live="polite"></div>
  </form>
</div>
<script src="age-core.js"></script>
<script>
function age() {
  const values = ['year', 'month', 'date'].map(id => document.getElementById(id).value.trim());
  try {
    if (values.some(value => !/^\d+$/.test(value))) throw new Error('Enter your complete date of birth.');
    const result = calculateCalendarAge(...values.map(Number));
    document.getElementById('age').textContent = `Your age is ${result.years} years, ${result.months} months and ${result.days} days.`;
  } catch (error) {
    document.getElementById('age').textContent = error.message;
  }
}
</script>
</body>
</html>
